<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doc’s Full-Game Totals War Room</title>
<style>
:root{--navy:#102a4c;--blue:#164c9b;--gold:#e9b85b;--green:#18734b;--red:#aa283b;--ink:#172c46;--muted:#52627a;--line:#d8e1ec;--pale:#f3f7fc}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:var(--ink);background:white}
.wrap{max-width:1160px;margin:auto;padding-inline:clamp(14px,4vw,36px)}header{background:var(--navy);color:white;padding:28px 0;border-bottom:5px solid var(--gold)}
h1{margin:4px 0;font-size:clamp(1.55rem,4vw,2.55rem)}h2{margin:0;font-size:1.27rem}p{line-height:1.55}
.league{color:#ffdb95;font-size:.82rem;font-weight:700;letter-spacing:.05em}main{padding-block:24px 48px}
.status,.muted,small{color:var(--muted)}.status{margin:7px 0 16px}
section{margin-block:20px}.controls,.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
label{font-size:.82rem;font-weight:700;color:var(--muted)}select{display:block;width:100%;background:white;color:var(--ink);font:inherit;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:5px}
details{border:1px solid var(--line);border-radius:7px;margin-top:9px;background:white}summary{padding:13px 15px;cursor:pointer}
summary:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.game summary{display:grid;grid-template-columns:8rem minmax(0,1fr) minmax(6rem,.3fr);align-items:center;gap:12px}
.game summary::-webkit-details-marker{display:none}.game summary::marker{content:""}.time::before{content:"▸";margin-right:.4rem;color:var(--blue)}details[open] .time::before{content:"▾"}
.game summary:hover{background:var(--pale)}.game summary span,.metrics span{display:block}.total{text-align:right}.total strong{font-size:1.25rem}
.body{padding:0 15px 15px}.metrics{padding:11px;background:var(--pale);border-radius:5px}.metrics span{font-size:.8rem;color:var(--muted)}
.over,.fast{color:var(--green)}.under,.slow{color:var(--red)}.average,a{color:var(--blue)}.warning{color:var(--red)}
.table{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--pale)}a{overflow-wrap:anywhere}
@media(max-width:620px){.game summary{grid-template-columns:minmax(0,1fr) auto;gap:5px 10px}.time{grid-column:1/-1}.total strong{font-size:1.12rem}.matchup{font-size:.92rem}}
</style>
</head>
<body>
<header><div class="wrap"><div class="league">MEN’S COLLEGE BASKETBALL</div><h1>Doc’s Full-Game Totals War Room</h1></div></header>
<main class="wrap">
<h2>Today’s research board</h2><p id="status" class="status" role="status">Loading today’s slate…</p>
<div class="controls">
<label>Sort by<select id="sort"><option value="time">Game time</option><option value="total">Projected total</option><option value="pace">Projected possessions</option><option value="tempoGap">Tempo separation</option><option value="gap">Market separation</option><option value="environment">Scoring environment</option><option value="complete">Data completeness</option></select></label>
<label>Direction<select id="direction"><option value="">All directions</option><option>OVER</option><option>UNDER</option></select></label>
<label>Scoring environment<select id="environment"><option value="">All environments</option><option>High scoring</option><option>Midrange scoring</option><option>Low scoring</option></select></label>
<label>Data completeness<select id="complete"><option value="">All games</option><option value="model">Projection available</option><option value="market">Market comparison available</option><option value="missing">Missing projection or market</option></select></label>
</div>
<p id="count" class="muted"></p><div id="games"></div>
<section><details><summary>Data status and tempo distribution</summary><div class="body" id="health"></div></details></section>
<section><details><summary>Pregame receipts and results</summary><div class="body" id="review"></div></details></section>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const number = (value, digits = 1) => Number.isFinite(value) ? value.toFixed(digits) : '—';
const esc = value => String(value ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ct = (date, details = false) => date ? new Intl.DateTimeFormat('en-US', {
  timeZone:'America/Chicago', hour:'numeric', minute:'2-digit',
  ...(details ? {month:'short', day:'numeric', timeZoneName:'short'} : {})
}).format(new Date(date)) : '—';
const centralDate = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',dateStyle:'short'}).format(new Date());
const dollars = value => value != null && Number(value) > 0 && Number(value) < 1 ? number(Number(value)*100, Number(value)*100 % 1 ? 1 : 0)+'¢' : '—';
const american = value => Number.isFinite(value) ? (value > 0 ? '+' : '')+value : '—';
const gap = n => (n > 0 ? '+' : '') + number(n);
const direction = row => row?.direction ? '<strong class="'+row.direction.toLowerCase()+'">'+esc(row.direction)+'</strong>' : '—';
const link = (url, label) => {
  if (!url) return esc(label);
  const parsed = new URL(url);
  return parsed.protocol === 'https:' ? '<a href="'+esc(url)+'">'+esc(label)+'</a>' : esc(label);
};
const table = (heads, rows) => '<div class="table"><table><thead><tr>'+heads.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const metrics = items => '<div class="metrics">'+items.map(([name,value])=>'<div><span>'+esc(name)+'</span><strong>'+esc(value)+'</strong></div>').join('')+'</div>';
const compared = game => game.markets.filter(m => Number.isFinite(m.gap));
const representative = game => {
  const rows = compared(game);
  return rows.find(m => m.source === 'Kambi') || rows.filter(m=>dollars(m.yes)!=='—' && dollars(m.no)!=='—')
    .sort((a,b)=>Math.abs(Number(a.yes)-Number(a.no))-Math.abs(Number(b.yes)-Number(b.no)) || a.line-b.line)[0];
};
const title = game => game.teams.map(t=>t.displayName).join(' vs ');
function marketTable(rows) {
  return table(['Market','Line','Prices','Direction','Gap','Separation','Market time CT'],rows.map(m=>[
    m.source==='Kalshi' ? esc(m.source)+' <small>'+esc(m.ticker)+'</small>' : link(m.sourceUrl,m.source),
    number(m.line),m.source==='Kalshi' ? 'YES '+dollars(m.yes)+' / NO '+dollars(m.no) : 'O '+american(m.over)+' / U '+american(m.under),
    direction(m),gap(m.gap),esc(m.category),ct(m.timestamp,true)
  ]));
}
function card(game) {
  const m = game.model, reference = representative(game);
  const teamNames = game.teams.map(t=>t.displayName);
  const details = m ? metrics([['Projected possessions',number(m.possessions)],['Scoring environment',m.environment],['Tempo separation',number(m.tempoGap)],
    ...teamNames.map((name,i)=>[name+' projected points',number(m.scores[i])])]) : '<p>Projection unavailable for this matchup.</p>';
  const ratings = m?.inputs ? table(['Team','AdjT','Tempo','AdjO','AdjD','AdjEM','Rank','Record'],m.inputs.map((t,i)=>[
    esc(teamNames[i]),number(t.tempo),'<strong class="'+(t.classification.includes('Fast')?'fast':t.classification.includes('Slow')?'slow':'average')+'">'+esc(t.classification)+'</strong>',
    number(t.offense),number(t.defense),number(t.margin),esc(t.rank),esc(t.record)
  ])) : '<p class="muted">Individual ratings and tempo classifications are unavailable on the public board.</p>';
  const explanation = m ? '<p>'+esc(m.version==='average-pace-efficiency-v1' ? 'The model averages both adjusted tempos, then pairs each offense with the opposing defense.' : 'The CBB calculator estimates possessions from both adjusted tempos and pairs each offense with the opposing defense using its national efficiency baseline.')+
    ' Projected matchup efficiencies are '+number(m.efficiencies[0])+' and '+number(m.efficiencies[1])+' points per 100 possessions. The scoring environment combines these efficiencies with projected possessions.</p>'+
    '<p><small>'+link(m.source,'Projection source')+' · Ratings retrieved '+ct(m.ratingsAt,true)+' · '+esc(m.version)+(m.stale?' · <strong class="warning">Stale ratings</strong>':'')+'</small></p>' : '';
  const quotes = game.markets.length ? marketTable(game.markets) : '<p class="muted">No verified market quote available.</p>';
  const rules = game.markets.filter(x=>x.rules).map(x=>'<li>'+esc(x.rules)+'</li>');
  return '<details class="game"><summary><span class="time">'+ct(game.start)+'<small>'+esc(game.status)+'</small></span><span class="matchup"><strong>'+esc(title(game))+'</strong><small>'+
    (game.neutral?'Neutral site · ':'')+esc(game.venue ?? 'Venue unavailable')+(game.scores?' · Final '+esc(game.scores.join('–')):'')+
    '</small></span><span class="total"><strong>'+number(m?.total)+'</strong><small>'+direction(reference)+(reference?' · '+esc(reference.source):'')+'</small></span></summary><div class="body">'+details+ratings+explanation+quotes+
    (rules.length?'<details><summary>Kalshi contract rules</summary><div class="body"><ul>'+rules.join('')+'</ul><p>'+esc(game.markets.find(x=>x.secondaryRules)?.secondaryRules || '')+'</p></div></details>':'')+
    '<p><small>'+(game.receipt?'Pregame receipt saved':'Pregame receipt pending or unavailable')+'</small></p></div></details>';
}
function history(data) {
  const rows=data.archive || [];
  if (!rows.length) return '<p>No pregame receipts have been recorded.</p>';
  const summary = Object.entries(data.review || {});
  return '<p>'+rows.length+' saved forecasts. Signed error is projected minus actual. Win rate uses wins and losses.</p>'+
    (summary.length?table(['Group','Games','MAE','Wins','Losses','Pushes','Win rate'],summary.map(([name,s])=>{
      const w=s.outcomes.Win||0,l=s.outcomes.Loss||0;
      return [esc(name),s.games,number(s.mae),w,l,s.outcomes.Push||0,w+l?number(100*w/(w+l))+'%':'—'];
    })):'<p>Waiting for completed games to grade.</p>')+
    rows.slice().reverse().map(({receipt:r,result:f})=>'<details><summary>'+esc(r.teams.join(' vs '))+' · '+ct(r.start,true)+'</summary><div class="body">'+
      metrics([['Saved CT',ct(r.savedAt,true)],['Model',r.model.version],['Projected possessions',number(r.model.possessions)],...r.teams.map((t,i)=>[t,number(r.model.scores[i])]),
      ['Projected total',number(r.model.total)],['Actual total',number(f?.total,0)],['Signed error',gap(f?.error)],['Absolute error',number(f?.absoluteError)]])+
      '<p>'+link(r.model.source,'Projection source')+' · Ratings retrieved '+ct(r.model.ratingsAt,true)+'</p>'+
      (r.markets.length?marketTable(r.markets):'')+(f?.grades.length?'<p>'+f.grades.map(g=>esc(g.source+' '+(g.outcome||'ungraded'))).join(' · ')+'</p>':'')+'</div></details>').join('');
}
function render(data) {
  const mode=el('sort').value, dir=el('direction').value, environment=el('environment').value, completeness=el('complete').value;
  const value = (g, key) => ({time:-Date.parse(g.start), total:g.model?.total, pace:g.model?.possessions, tempoGap:g.model?.tempoGap,
    gap:Math.abs(representative(g)?.gap), environment:{'High scoring':3,'Midrange scoring':2,'Low scoring':1}[g.model?.environment],
    complete:Number(Boolean(g.model))+Number(Boolean(representative(g)))})[key];
  const rows=data.games.filter(g=>(!dir||representative(g)?.direction===dir)&&(!environment||g.model?.environment===environment)&&
    (!completeness||(completeness==='model'?g.model:completeness==='market'?representative(g):!representative(g))))
    .sort((a,b)=>(Number.isFinite(value(b,mode))?value(b,mode):-Infinity)-(Number.isFinite(value(a,mode))?value(a,mode):-Infinity)||Date.parse(a.start)-Date.parse(b.start));
  el('count').textContent=rows.length+' of '+data.games.length+' games · Market separation measures a point difference.';
  el('games').innerHTML=rows.map(card).join('')||'<p>No games match these filters.</p>';
}
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok) throw Error('HTTP '+r.status);return r.json()}).then(data=>{
  const stale=data.date!==centralDate()||Date.now()-Date.parse(data.updated)>45*60000;
  el('status').textContent=(stale?'Stale slate · ':'')+data.date+' · Last successful refresh '+ct(data.updated,true)+' · All times Central';
  el('status').classList.toggle('warning',stale);
  el('health').innerHTML='<p>'+link(data.source,'ESPN scoreboard')+'</p><ul>'+Object.entries(data.health||{}).map(([k,v])=>'<li>'+esc(k)+' · '+esc(v)+'</li>').join('')+'</ul>'+
   '<p>'+(data.distribution?Object.entries(data.distribution).map(([k,v])=>esc(k)+' '+v).join(' · '):'Season tempo distribution unavailable. Thresholds remain experimental.')+'</p>';
  el('review').innerHTML=history(data);
  for(const id of ['sort','direction','environment','complete']) el(id).addEventListener('change',()=>render(data));
  render(data);
}).catch(error=>{
  el('status').textContent='The published slate could not be loaded.';
  el('status').classList.add('warning');
  console.error(error);
});
</script>
</body>
</html>
